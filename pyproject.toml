[project]
name = "nma"
version = "1.0.0"
description = "National Metadata Directory"
packages = []
authors = []
dependencies = [
    "json5",
    "oarepo[s3,rdm]>=14.0.0,<15.0.0",
    "oarepo-app[ccmm,production,oaipmh-harvester]>=8.0.0,<9.0.0",
    "python-dotenv",
    "beautifulsoup4",
    "rapidfuzz",
    "traceback-with-variables",                    # for better error logging
    "prometheus-flask-exporter",                   # to expose Flask app /metrics to prometheus
]
requires-python = ">=3.14,<3.15"

[project.entry-points."invenio_base.api_apps"]
riv_extension = "riv.ext:RIVResolverExtension"

[project.entry-points."invenio_base.apps"]
riv_extension = "riv.ext:RIVResolverExtension"
metrics_extension = "metrics.ext:PrometheusMetricsExporterExt"

[project.entry-points."invenio_assets.webpack"]
i18n = "i18n.webpack:theme"
components = "ui.components.webpack:theme"
ui_datasets = "ui.datasets.webpack:theme"

[project.entry-points."invenio_db.alembic"]
repository = "common:alembic"

[project.entry-points."invenio_base.blueprints"]
ui_datasets = "ui.datasets:create_blueprint"
record_detail_redirect = "ui.datasets:create_record_detail_redirect_blueprint"
uploads_redirect = "ui.datasets:create_uploads_redirect_blueprint"
registered = "ui.datasets:create_registered_blueprint"
harvest_validate = "ui.harvest_validate:create_blueprint"

[project.entry-points."invenio_i18n.translations"]
translations = "i18n"

# TEMPORARY: collected oarepo translations, loaded after package catalogs so they override them
[project.entry-points."invenio_i18n.translations_bundle"]
temporary_flask_security = "oarepo.collected_translations.flask_security"
temporary_invenio_access = "oarepo.collected_translations.invenio_access"
temporary_invenio_accounts = "oarepo.collected_translations.invenio_accounts"
temporary_invenio_administration = "oarepo.collected_translations.invenio_administration"
temporary_invenio_app_rdm = "oarepo.collected_translations.invenio_app_rdm"
temporary_invenio_banners = "oarepo.collected_translations.invenio_banners"
temporary_invenio_collections = "oarepo.collected_translations.invenio_collections"
temporary_invenio_communities = "oarepo.collected_translations.invenio_communities"
temporary_invenio_drafts_resources = "oarepo.collected_translations.invenio_drafts_resources"
temporary_invenio_files_rest = "oarepo.collected_translations.invenio_files_rest"
temporary_invenio_formatter = "oarepo.collected_translations.invenio_formatter"
temporary_invenio_github = "oarepo.collected_translations.invenio_github"
temporary_invenio_i18n = "oarepo.collected_translations.invenio_i18n"
temporary_invenio_notifications = "oarepo.collected_translations.invenio_notifications"
temporary_invenio_oaiserver = "oarepo.collected_translations.invenio_oaiserver"
temporary_invenio_oauth2server = "oarepo.collected_translations.invenio_oauth2server"
temporary_invenio_oauthclient = "oarepo.collected_translations.invenio_oauthclient"
temporary_invenio_pages = "oarepo.collected_translations.invenio_pages"
temporary_invenio_pidstore = "oarepo.collected_translations.invenio_pidstore"
temporary_invenio_previewer = "oarepo.collected_translations.invenio_previewer"
temporary_invenio_rdm_records = "oarepo.collected_translations.invenio_rdm_records"
temporary_invenio_records = "oarepo.collected_translations.invenio_records"
temporary_invenio_records_resources = "oarepo.collected_translations.invenio_records_resources"
temporary_invenio_records_rest = "oarepo.collected_translations.invenio_records_rest"
temporary_invenio_records_ui = "oarepo.collected_translations.invenio_records_ui"
temporary_invenio_requests = "oarepo.collected_translations.invenio_requests"
temporary_invenio_saml = "oarepo.collected_translations.invenio_saml"
temporary_invenio_search_ui = "oarepo.collected_translations.invenio_search_ui"
temporary_invenio_stats = "oarepo.collected_translations.invenio_stats"
temporary_invenio_theme = "oarepo.collected_translations.invenio_theme"
temporary_invenio_userprofiles = "oarepo.collected_translations.invenio_userprofiles"
temporary_invenio_users_resources = "oarepo.collected_translations.invenio_users_resources"
temporary_invenio_vocabularies = "oarepo.collected_translations.invenio_vocabularies"
temporary_marshmallow_utils = "oarepo.collected_translations.marshmallow_utils"

[project.entry-points."invenio_base.finalize_app"]
ui_datasets = "ui.datasets:finalize_app"

[project.entry-points."flask.commands"]
riv = "riv.cli:riv"

[project.entry-points."invenio_celery.tasks"]
riv = "riv.tasks"
datasets = "models.datasets.tasks"

[project.entry-points."invenio_jobs.jobs"]
invenio_command = "riv.tasks:InvenioTaskJob"
create_missing_indices = "riv.tasks:CreateMissingIndicesJob"
rebuild_all_indices = "riv.tasks:RebuildAllIndicesJob"
check_record_availability = "riv.tasks:CheckAvailabilityJob"
cleanup_unknown_titles = "riv.tasks:CleanupUnknownTitlesJob"
load_identifiers_from_riv_dump = "riv.tasks:LoadIdentifiersFromRIVDumpJob"

[project.entry-points."invenio_access.actions"]
manage_record_action = "models.datasets.permissions:manage_record_action"

# `invenio rdm-records add-to-fixture communities` creates the missing communities
[project.entry-points."oarepo.fixtures"]
communities = "common.fixtures:CommunitiesFixture"

[tool.uv]

# CESNET GitLab package index - hosts CI-built artifacts pinned by oarepo
# that are not published on PyPI (e.g. citeproc-py-styles==0.1.5.45528422).
# This mirrors PIP_EXTRA_INDEX_URL from .runner.sh so plain `uv` commands work.
[[tool.uv.index]]
url = "https://gitlab.cesnet.cz/api/v4/projects/1408/packages/pypi/simple"

[tool.uv.build-backend]
module-root = ""
module-name = [
    "common",
    "i18n",
    "ui",
    "models",
]

[tool.uv.sources]

[build-system]
requires = [
    "uv_build>=0.8.7,<0.9.0",
]
build-backend = "uv_build"

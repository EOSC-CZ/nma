[project]
name = "nma"
version = "1.0.0"
description = "National Metadata Directory"
packages = []
authors = []
dependencies = [
    "json5",
    "oarepo[rdm,s3]>=14.0.0,<15.0.0",
    "oarepo-runtime>=2.0.0dev0,<3.0.0",
    "oarepo-ui>=6.0.0.dev0,<7.0.0",
    "oarepo-model>=0.1.0dev0,<1.0.0",
    "oarepo-rdm>=1.0.0dev0,<2.0.0",
    "oarepo-theme>=1.0.0dev3,<2.0.0",
    "oarepo-dashboard>=2.0.0dev1,<3.0.0",
    "python-dotenv",
    "marshmallow-i18n-messages",
    "oarepo-glitchtip==1.*",
    "oarepo-oidc-einfra>=2.0.0dev0,<3.0.0",
    "beautifulsoup4",
    "rapidfuzz",
    "oarepo-vocabularies>=3.0.0dev6,<4.0.0"

]
requires-python = ">=3.13,<3.15"

[project.entry-points."invenio_base.api_apps"]
riv_extension = "riv.ext:RIVResolverExtension"

[project.entry-points."invenio_base.apps"]
riv_extension = "riv.ext:RIVResolverExtension"

[project.entry-points."invenio_assets.webpack"]
i18n = "i18n.webpack:theme"
components = "ui.components.webpack:theme"
ui_datasets = "ui.datasets.webpack:theme"

[project.entry-points."invenio_i18n.translations"]
translations = "i18n"

[project.entry-points."invenio_db.alembic"]
repository = "common:alembic"

[project.entry-points."invenio_base.blueprints"]
ui_datasets = "ui.datasets:create_blueprint"

[project.entry-points."invenio_base.finalize_app"]
ui_datasets = "ui.datasets:finalize_app"

[project.entry-points."flask.commands"]
riv = "riv.cli:riv"

[project.entry-points."invenio_celery.tasks"]
riv = "riv.tasks"

[tool.uv.build-backend]
module-root = ""
module-name = [
    "common",
    "i18n",
    "ui",
    "datasets",
]

[build-system]
requires = [
    "uv_build>=0.8.7,<0.9.0",
]
build-backend = "uv_build"

from celery.schedules import crontab
from invenio_i18n import lazy_gettext as _
from oarepo import config

# glitchtip for reporting incidents
config.initialize_glitchtip()
# i18n
config.initialize_i18n()

config.configure_generic_parameters(
    languages=(("cs", _("Czech")),), use_path_pid_ids=True
)
config.configure_ui(
    code="nmd",
    name=_("National Metadata Directory"),
    subtitle=_("Harvesting metadata of scientific repositories in the Czech Republic"),
    description=_(
        "The National Metadata Directory (NMD) aggregates metadata from Czech research repositories and enables unified searching across datasets with links to original records."
    ),
    keywords=_(
        "national metadata directory, NMD, dataset metadata, research data search, data repositories, metadata aggregator, Czech academic data, research datasets, data discovery platform, eosc-cz, eosc cz, european open science cloud"
    ),
    support_contact="info@eosc.cz",
)
config.configure_stats()
config.configure_cron(
    check_record_availability={
        "task": "riv.tasks.check_availability.check_availability_task",
        "schedule": crontab(minute=0, hour=2),  # Every day at 02:00 UTC
    },
    add_grant_expiration_task={
        "task": "datasets.tasks.add_grant_expiration_task",
        "schedule": crontab(minute=0, hour=10),  # Every day at 10:00 UTC
    },
    expire_grants={
        "task": "datasets.tasks.expire_grants_task",
        "schedule": crontab(minute=10, hour=10),  # Every day at 10:10 UTC
    },
    cleanup_unknown_titles={
        "task": "riv.tasks.cleanup_drafts.cleanup_unknown_titles",
        "schedule": crontab(minute=10, hour=10),  # Every day at 10:10 UTC
    },
)

config.configure_datastreams(readers={"catch-all": "datasets.oai.catchall.CatchAllReader",
                                    "zenodo": "datasets.oai.zenodo.ZenodoReader"},
                             transformers={"catch-all": "datasets.oai.catchall.CatchAllTransformer",

from invenio_i18n import lazy_gettext as _
from oarepo import config
from oarepo_app.config import CommunityWorkflow, IndividualWorkflow, configure_workflows

# glitchtip for reporting incidents
config.initialize_glitchtip()

# i18n
config.initialize_i18n()

config.configure_generic_parameters(
    languages=(
        ("cs", _("Czech")),
    ),
)

config.configure_ui(
    code="nma",
    name=_("NMA"),
    description=_("""National Metadata Directory"""),
)

config.configure_communities(
    # Configure custom community roles if not using the default (owner, curator, member).
    # Leave empty to use default roles.
    # See: https://nrp-cz.github.io/docs/customize/configure/reference#configure_communities
    communities_roles=[
        # note: order matters, roles should be sorted by importance
        # from the most important to the least
        dict(
            name="owner",
            title=_("Community owner"),
            description=_("Can manage community."),
            is_owner=True,
            can_manage=True,
            can_manage_roles=["owner", "curator", "member", "submitter"],
        ),
        dict(
            name="curator",
            title=_("Curator"),
            description=_("Can curate records."),
            can_manage=True,
            can_manage_roles=["member", "submitter"],
        ),
        dict(
            name="submitter",
            title=_("Submitter"),
            description=_("Can submit records to the community."),
            can_manage=True,
            can_manage_roles=[],
        ),
        dict(
            name="member",
            title=_("Member"),
            description=_("Community member with read permissions."),
        ),
    ]
)

configure_workflows(
    IndividualWorkflow(
        publish_without_review=False,
        review_required=True,
        self_review_enabled=True,
        draft_creation_roles=["submitter"],
        publish_without_review_roles=["direct-publisher"],
    ),
    CommunityWorkflow(code="community", label=_("Default Community Workflow")),
)

config.configure_stats()

config.configure_cron()


# Definition of record for datasets. Please do not add ccmm model here,
# add the ccmm_preset instead.
Record:
  type: object
  properties:
    editors:
      type: array
      items:
        type: object
        properties:
          id:
            type: keyword
          full_name:
            type: keyword
          affiliations:
            type: keyword
          expiration:
            type: datetime
          access_granted:
            type: array
            items:
              type: datetime

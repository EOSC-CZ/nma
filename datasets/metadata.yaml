# Definition of metadata for datasets. Please do not add ccmm model here,
# add the ccmm_preset instead.
Metadata:
  type: object
  properties:
    persistent_url:
      type: keyword
    last_checked:
      type: datetime
    check_status:
      type: keyword
      enum:
        - success
        - not_found
        - error
    check_message:
      type: fulltext

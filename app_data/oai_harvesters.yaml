- id: datarepo-test
  name: "Catch-all Multi-discipline data repository, tests only, never use in production"
  base-url: "https://test1.datarepo.du.cesnet.cz/oai2d"
  metadata-prefix: "ccmm"
  model: datasets
  community: datarepo
  loader: oai-pmh
  transformer:
    - 'oai-import{"model":"datasets"}'
    - "id-from-doi"

- id: datarepo
  name: "Catch-all Multi-discipline data repository"
  base-url: "https://datarepo.eosc.cz/oai2d"
  metadata-prefix: "ccmm"
  model: datasets
  community: datarepo
  loader: oai-pmh
  transformer:
    - 'oai-import{"model":"datasets"}'
    - "id-from-doi"

- id: zenodo-czu
  name: "Zenodo CZU harvester"
  base-url: "https://zenodo.org"
  metadata-prefix: "czu"
  model: datasets
  community: zenodo-czu
  loader: zenodo
  transformer:
    - "zenodo"
  setspec: 'creators.affiliation:("Česká zemědělská univerzita v Praze" OR "ČZU" OR "CESKA ZEMEDELSKA UNIVERZITA V PRAZE" OR "CZU Praha" OR "The Czech University of Life Sciences Prague" OR "Czech University of Agriculture Prague")  AND resource_type.type:dataset'

- id: zenodo-cvut
  name: "Zenodo CVUT harvester"
  base-url: "https://zenodo.org"
  metadata-prefix: "cvut"
  model: datasets
  community: zenodo-cvut
  loader: zenodo
  transformer:
    - "zenodo"
  setspec: 'creators.affiliation:("České vysoké učení technické v Praze" OR "ČVUT" OR "CESKE VYSOKE UCENI TECHNICKE V PRAZE" OR "CVUT" OR "Czech Technical University In Prague" OR "CTU in Prague" OR "CTU Prague")  AND resource_type.type:dataset'

- id: zenodo-upol
  name: "Zenodo UPOL harvester"
  base-url: "https://zenodo.org"
  metadata-prefix: "upol"
  model: datasets
  community: zenodo-upol
  loader: zenodo
  transformer:
    - "zenodo"
  setspec: 'creators.affiliation:("upol" OR "Univerzita Palackého v Olomouci" OR "Palacký University Olomouc" OR "Palacky University Olomouc") AND resource_type.type:dataset'

- id: zenodo-utb
  name: "Zenodo UTB harvester"
  base-url: "https://zenodo.org"
  metadata-prefix: "utb"
  model: datasets
  community: zenodo-utb
  loader: zenodo
  transformer:
    - "zenodo"
  setspec: 'creators.affiliation:("utb" OR "Univerzita Tomáše Bati ve Zlíně" OR "Tomas Bata University in Zlin") AND resource_type.type:dataset'

- id: zenodo-vscht
  name: "Zenodo VSCHT harvester"
  base-url: "https://zenodo.org"
  metadata-prefix: "vscht"
  model: datasets
  community: zenodo-vscht
  loader: zenodo
  transformer:
    - "zenodo"
  setspec: '(creators.affiliation:("vscht" OR "Vysoká škola chemicko-technologická v Praze" OR "UCT Prague" OR "University of Chemistry and Technology, Prague") OR communities:uct-prague) AND resource_type.type:dataset'

- id: lindat
  name: "LINDAT/CLARIN repository harvester"
  base-url: "https://lindat.mff.cuni.cz/repository/server/oai/request"
  metadata-prefix: "cmdi"
  model: datasets
  community: lindat
  loader: oai-pmh
  transformer:
    - "lindat"

- id: av
  name: "Academy of Sciences repository harvester"
  base-url: "https://asep.lib.cas.cz/arl-cav/cs/oai/"
  metadata-prefix: "dataciteoai"
  setspec: OAIDATACITE
  model: datasets
  community: av
  loader: oai-pmh
  transformer:
    - 'oai-import{"model":"datasets"}'
    - "id-from-doi"

